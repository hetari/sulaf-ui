packages:
  - apps/*
  - packages/*
# e2e/fixtures are deliberately NOT here: they install like a real user project

allowBuilds:
  esbuild: true
catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  "@commitlint/cli": ^21.2.3
  "@commitlint/config-conventional": ^21.2.3
  "@lucide/vue": ^1.61.0
  "@vee-validate/zod": ^4.15.1
  "@vitejs/plugin-vue": ^6.0.10
  "@vueuse/core": ^15.0.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  cn: 0.5.0
  embla-carousel-vue: ^8.6.0
  execa: ^10.2.1
  husky: ^9.1.7
  nano-staged: ^1.0.2
  oxfmt: ^0.73.0
  oxlint: ^1.88.0
  oxlint-tsgolint: ^7.0.2004
  reka-ui: ^2.11.0
  shadcn-vue: 2.8.2
  shiki: ^4.5.0
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  tinyglobby: 0.2.17
  tsx: ^4.23.15
  turbo: ^2.11.8
  tw-animate-css: ^1.4.0
  typescript: ^5.9.3
  vee-validate: ^4.15.1
  vite: ^8.3.5
  vue: ^3.5.44
  vue-input-otp: ^0.4.0
  vue-sonner: ^2.0.9
  vue-tsc: ^3.3.13
  zod: 3.25.76
catalogMode: prefer # try the catalog first; check-catalog (Phase 12) is the hard gate
cleanupUnusedCatalogs: true # pnpm prunes catalog lines nobody uses

overrides: {} # force a single version if a transitive dep ever duplicates Vue
